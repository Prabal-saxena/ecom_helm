# --------------------------------------------------
# Role for microservice pods
# --------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{.Values.namespace}}
  name: {{.Values.deploymentName}}-sa-pod-creator
rules:
  - apiGroups: [""]
    resource: ["*"]
    verbs: ["get", "watch", "list", "create", "update", "delete", "patch"]
---
# --------------------------------------------------
# ServiceAccount for microservice pods
# --------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.Values.ksaServiceAccount}}
  namespace: {{.Values.namespace}}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gcpServiceAccount }}
---
# --------------------------------------------------
# RoleBinding for microservice pods
# --------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{.Values.deploymentName}}-sa-pod-creator
  namespace: {{.Values.namespace}}
subjects:
  - kind: ServiceAccount
    name: {{.Values.ksaServiceAccount}}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{.Values.deploymentName}}-sa-pod-creator
  apiGroup: rbac.authorization.k8s.io

---
# --------------------------------------------------
# ServiceAccount for CI/CD pipeline (GitHub Actions, Jenkins, etc.)
# --------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.Values.cicdKsaServiceAccount}}
  namespace: {{.Values.namespace}}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.cicdGcpServiceAccount }}

---
# --------------------------------------------------
# RoleBinding for CI/CD pipeline
# --------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{.Values.cicdKsaServiceAccount}}-deployer
  namespace: {{.Values.namespace}}
subjects:
  - kind: ServiceAccount
    name: {{.Values.cicdKsaServiceAccount}}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io