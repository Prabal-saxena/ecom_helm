# --------------------------------------------------
# Role for microservice pods
# --------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{.Values.namespace}}
  name: {{.Values.deploymentName}}-sa-pod-creator
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["get", "watch", "list", "create", "update", "delete", "patch"]
---
# --------------------------------------------------
# ServiceAccount for microservice pods
# --------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.Values.ksaServiceAccount}}
  namespace: {{.Values.namespace}}
  annotations:
    # 1. This hook ensures the ServiceAccount is created BEFORE the main install/upgrade.
    helm.sh/hook: pre-install,pre-upgrade
    # 2. This policy ensures the resource is NOT deleted when the hook completes.
    helm.sh/hook-delete-policy: before-hook-creation

    iam.gke.io/gcp-service-account: {{ .Values.gcpServiceAccount }}
---
# --------------------------------------------------
# RoleBinding for microservice pods
# --------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{.Values.deploymentName}}-sa-pod-creator
  namespace: {{.Values.namespace}}
subjects:
  - kind: ServiceAccount
    name: {{.Values.ksaServiceAccount}}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{.Values.deploymentName}}-sa-pod-creator
  apiGroup: rbac.authorization.k8s.io

---
# --------------------------------------------------
# ServiceAccount for CI/CD pipeline (GitHub Actions)
# --------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.Values.cicdKsaServiceAccount}}
  namespace: {{.Values.namespace}}
  annotations:
    # Apply the same hook logic to ensure the CI/CD Service Account is ready early.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation

    iam.gke.io/gcp-service-account: {{ .Values.cicdGcpServiceAccount }}

---
# --------------------------------------------------
# RoleBinding for CI/CD pipeline
# --------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{.Values.cicdKsaServiceAccount}}-deployer
  namespace: {{.Values.namespace}}
subjects:
  - kind: ServiceAccount
    name: {{.Values.cicdKsaServiceAccount}}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io