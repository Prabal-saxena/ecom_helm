name: "Upload Helm Package"

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: write

env:
  ARTIFACTORY_URL: "us-central1-docker.pkg.dev/noble-linker-471623-s6"
  ARTIFACTORY_REPO: "common-artifacts"
  APPLICATION_NAME: "ecom_helm"

jobs:
  build:
    name: Package and Upload Helm Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CI_CD_SA_SECRET }}

      - name: Common Setup for Artifactory Credentials & file version
        uses: ./.github/actions/common

      - name: Package Helm Chart
        run: |- 
          echo "Zipping helm templates..."
          helm package ./helm

      - name: Install Helm OCI Push Plugin
        run: helm plugin install https://github.com/chartmuseum/helm-push

      - name: Uploads to GCP Artifactory
        shell: bash
        run: |-
          echo "Push to artifactory"
          helm push ecom_helm-0.1.0.tgz oci://${ARTIFACTORY_URL}/${ARTIFACTORY_REPO}
